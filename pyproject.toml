[project]
name = "macropad"
version = "0.1.0"
description = "Run Python or GUI-configured shortcuts from a DOIO KB16 macro pad"
readme = "README.md"
authors = [
    { name = "Sym Roe", email = "sym.roe@talusdesign.co.uk" }
]
requires-python = ">=3.11"
dependencies = [
    "evdev-binary>=2.0.0",
    "tomli-w>=1.2.0",
]

[project.scripts]
macropad = "macropad:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
